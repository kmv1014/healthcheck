<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Parivar Health</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first app shell — member strip on top, one view at a time, bottom tab bar, floating "Add report". */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#17242E; --muted:#5B6B70; --line:#D9E0DC;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#DCEDE8;
  --high:#B93E0C; --high-soft:#FBE5D9; --low:#2459A8; --low-soft:#DFE8F7; --ok:#3B7A4C; --ok-soft:#E2F0E4; --warn:#9A6512; --warn-soft:#F8EBD3;
  --m1:#0E6E62; --m2:#9C4A7A; --m3:#2E5E9E; --m4:#A2611A; --m5:#5B5FA8;
  --shadow:0 8px 28px rgba(23,36,46,.14);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172226; --sunk:#1D2A2E; --ink:#E4ECE9; --muted:#93A4A5; --line:#2A393E;
  --accent:#4FC1AE; --accent-ink:#06201B; --accent-soft:#163A35;
  --high:#F08A5D; --high-soft:#3B2219; --low:#82AEF0; --low-soft:#1B2840; --ok:#7BC48E; --ok-soft:#183020; --warn:#E2B04F; --warn-soft:#352812;
  --m1:#4FC1AE; --m2:#E08BBB; --m3:#82AEF0; --m4:#E8A55C; --m5:#A3A6F0;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172226; --sunk:#1D2A2E; --ink:#E4ECE9; --muted:#93A4A5; --line:#2A393E;
  --accent:#4FC1AE; --accent-ink:#06201B; --accent-soft:#163A35;
  --high:#F08A5D; --high-soft:#3B2219; --low:#82AEF0; --low-soft:#1B2840; --ok:#7BC48E; --ok-soft:#183020; --warn:#E2B04F; --warn-soft:#352812;
  --m1:#4FC1AE; --m2:#E08BBB; --m3:#82AEF0; --m4:#E8A55C; --m5:#A3A6F0;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{-webkit-tap-highlight-color:transparent}
button,a,input,select,label,textarea,.tile{touch-action:manipulation}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* Top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:grid;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
@media (max-width:400px){.brand h1{font-size:20px}.brand h1 svg{width:22px;height:22px}.sync{font-size:11px;padding:3px 8px}.summary>div{padding:10px}.summary b{font-size:19px}.summary span{font-size:12px}}
.brand h1 svg{color:var(--accent)}
.sync{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.sync.cloud{background:var(--ok-soft);color:var(--ok)}
.members{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.members::-webkit-scrollbar{display:none}
.members{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:28px;scroll-snap-type:x proximity}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700;font-size:15px;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.add{padding:5px 14px;color:var(--accent);border-style:dashed}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.chip[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--bg)}

/* Views */
.view{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.summary>div{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.summary b{font-family:var(--f-display);font-size:22px;font-weight:800}
.summary span{font-size:13px;color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-h h2{font-size:20px}
.list{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.rec:hover{border-color:var(--muted)}
.rec .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.rec .ic.rx{background:var(--warn-soft);color:var(--warn)}
.rec .ic.doc{background:var(--sunk);color:var(--muted)}
.rec h3{font-family:var(--f-body);font-size:16px;font-weight:700;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec p{margin:0;font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.h{background:var(--high-soft);color:var(--high)}
.pill.l{background:var(--low-soft);color:var(--low)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--sunk);color:var(--muted)}
.empty{text-align:center;padding:32px 20px;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.danger{background:transparent;color:var(--high);border:1.5px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.banner button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:8px 4px;min-height:40px}

/* Trends */
.params{display:flex;gap:8px;flex-wrap:wrap}
.pchip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.h{background:var(--high)}.dot.l{background:var(--low)}.dot.ok{background:var(--ok)}
.chart-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chart-head h2{font-size:22px}
.big{font-family:var(--f-data);font-size:30px;font-weight:500;line-height:1}
.chart svg{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:700}
td.v{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
td.v.h{color:var(--high);font-weight:700}
td.v.l{color:var(--low);font-weight:700}
td.pn{position:sticky;left:0;background:var(--surface);font-weight:700;z-index:1;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
th.pn{position:sticky;left:0;z-index:2}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunk)}
tr.sel td{background:var(--accent-soft)}
.ref{font-size:12px;color:var(--muted);font-family:var(--f-data)}

/* Medicines */
.med{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.med:last-child{border-bottom:0}
.med b{font-size:16px}
.med p{margin:0;font-size:14px;color:var(--muted)}
.x{border:0;background:var(--sunk);width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ix{border-radius:14px;padding:14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--surface)}
.ix.major{border-left:6px solid var(--high)}
.ix.moderate{border-left:6px solid var(--warn)}
.ix.minor{border-left:6px solid var(--low)}
.ix h3{font-family:var(--f-body);font-size:16px;font-weight:700;letter-spacing:0}
.ix p{margin:0;font-size:14.5px}
.disclaimer{font-size:13px;color:var(--muted);margin:0}
.inline-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
@media (max-width:520px){.inline-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.inline-form .wide{grid-column:1/-1}}

/* Chat */
.chat{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:15.5px;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-left:20px}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.suggest button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;text-align:left}
body.typing .nav,body.typing .fab{display:none}
body.typing .composer{bottom:env(safe-area-inset-bottom,0px)}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.composer textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;min-height:48px;max-height:140px}

/* Bottom nav + FAB */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:9px 4px 10px;font-size:12.5px;font-weight:700;color:var(--muted);min-height:62px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{transform:translateY(-1px)}
.fab{position:fixed;z-index:26;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 18px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);min-height:52px}
@media (min-width:760px){.fab{right:calc(50% - 344px)}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,18,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);width:100%;max-width:720px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h2{font-size:22px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inline-form input,.grid-in input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative}
.tile input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:1}
.tile:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}
.pick button,.pick .tile{-webkit-tap-highlight-color:transparent;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 14px;display:grid;gap:6px;text-align:left;cursor:pointer}
.pick b{font-size:15.5px}
.pick span{font-size:13px;color:var(--muted)}
.pick svg{color:var(--accent)}
.wa{background:var(--sunk);border-radius:14px;padding:14px;display:grid;gap:8px;font-size:14.5px}
.wa ol{margin:0;padding-left:20px;display:grid;gap:4px}
.grid-in{display:grid;gap:8px}
.grid-in .r{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.grid-in .r.m{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.4fr) 40px}
.grid-in input{min-height:44px;padding:8px 10px;font-size:16px}
.grid-in .hdr{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:520px){
  .grid-in .r.hdr{display:none}
  .grid-in .r{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;grid-template-areas:"nm nm x" "va un un" "lo hi hi";background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;gap:8px}
  .grid-in .r.m{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;grid-template-areas:"nm nm x" "do fr fr"}
  .grid-in .r .nm{grid-area:nm}.grid-in .r .va{grid-area:va}.grid-in .r .un{grid-area:un}.grid-in .r .lo{grid-area:lo}.grid-in .r .hi{grid-area:hi}.grid-in .r .do{grid-area:do}.grid-in .r .fr{grid-area:fr}.grid-in .r .x{grid-area:x}
  .grid-in .r input{background:var(--bg)}
}
.busy{display:flex;gap:12px;align-items:center;padding:20px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.thumb{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.note{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);left:0;bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.swatches{display:flex;gap:10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M12 11v6M9 14h6"/></svg>Parivar Health</h1>
      <span class="row" style="gap:8px;flex-wrap:nowrap"><span class="sync" id="sync">On this device</span><button class="x" type="button" id="gear" hidden aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button></span>
    </div>
    <div class="members" id="members" role="toolbar" aria-label="Family members"></div>
  </header>
  <main id="main"></main>
</div>

<button class="fab" id="fab" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add report</button>

<nav class="nav" aria-label="Sections"><div class="nav-in" id="nav"></div></nav>
<div id="layer"></div>


<script>
/* Android app bridge: AI calls go through the app to the Claude API with the user's own key. */
(function(){
  if(!window.AndroidBridge)return;
  var KEYK="parivar-api-key";
  function getKey(){try{return localStorage.getItem(KEYK)||""}catch(e){return""}}
  function setKey(k){try{k?localStorage.setItem(KEYK,k):localStorage.removeItem(KEYK)}catch(e){}}
  var pending={},seq=0;

function trendData(mid){
  const blood=records(mid).filter(r=>r.type==="blood"&&r.date).sort((a,b)=>a.date.localeCompare(b.date));
  const dates=[...new Set(blood.map(r=>r.date))];
  const P={};
  blood.forEach(r=>(r.results||[]).forEach(x=>{const v=toNum(x.value);if(v===null)return;const k=pkey(x.name);if(!k)return;
    (P[k]=P[k]||{key:k,name:x.name,unit:x.unit||"",pts:{}}).pts[r.date]={v,lo:toNum(x.low),hi:toNum(x.high),f:flagOf(x)};P[k].name=x.name;if(x.unit)P[k].unit=x.unit;}));
  return {dates,params:Object.values(P).sort((a,b)=>a.name.localeCompare(b.name))};
}
function chartSVG(p,dates){
  const pts=dates.filter(d=>p.pts[d]).map(d=>({d,t:new Date(d+"T00:00:00").getTime(),...p.pts[d]}));
  const W=340,H=200,L=44,R=18,T=22,B=30;
  const last=pts[pts.length-1];const lo=last.lo,hi=last.hi;
  let ymin=Math.min(...pts.map(p=>p.v)),ymax=Math.max(...pts.map(p=>p.v));
  if(lo!==null&&lo>0)ymin=Math.min(ymin,lo);if(hi!==null)ymax=Math.max(ymax,hi);
  const pad=(ymax-ymin||Math.abs(ymax)||1)*0.18;ymin=Math.max(0,ymin-pad);ymax=ymax+pad;
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const x=t=>pts.length===1?(L+(W-L-R)/2):L+(t-t0)/(t1-t0)*(W-L-R);
  const y=v=>T+(1-(v-ymin)/(ymax-ymin))*(H-T-B);
  const ticks=[];const step=niceStep((ymax-ymin)/4);for(let v=Math.ceil(ymin/step)*step;v<=ymax+1e-9;v+=step)ticks.push(+v.toFixed(6));
  const dec=step<1?(step<0.1?2:1):0;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} over time">`;
  if(lo!==null||hi!==null){const yt=y(hi!==null?Math.min(hi,ymax):ymax),yb=y(lo!==null?Math.max(lo,ymin):ymin);s+=`<rect x="${L}" y="${yt}" width="${W-L-R}" height="${Math.max(0,yb-yt)}" fill="var(--ok-soft)"/>`;
    s+=`<text x="${W-R}" y="${yt+12}" text-anchor="end" font-size="10" fill="var(--ok)" font-family="var(--f-body)" font-weight="700">Normal range</text>`}
  ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-data)">${v.toFixed(dec)}</text>`});
  if(pts.length>1){s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>`}
  pts.forEach((p,i)=>{const c=p.f==="H"?"var(--high)":p.f==="L"?"var(--low)":"var(--ok)";const isL=i===pts.length-1;
    s+=`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="${isL?6.5:4.5}" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`;
    const lx=Math.min(W-R-2,Math.max(L+12,x(p.t)));
    s+=`<text x="${lx}" y="${y(p.v)-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="var(--f-data)">${p.v}</text>`;
    if(pts.length<=6||i===0||isL)s+=`<text x="${lx}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-body)">${esc(fmtShort(p.d))}</text>`;
  });
  return s+`</svg>`;
}
function niceStep(r){if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return (n<1.5?1:n<3?2:n<7?5:10)*p}

function renderIx(r){

function mdLite(t){

async function handleFile(file){
  if(!file)return;
  openSheet(`${sheetHead("Reading your report")}<div class="busy"><span class="spin"></span><div><b>Reading ${esc(file.name||"report")}…</b><div class="muted" style="font-size:14px">Finding the test names, values and reference ranges.</div></div></div>`);

  const isPdf=await looksPdf(file);

    if(isPdf){const r=await Promise.race([readPdf(file),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),25000))]);text=r.text;images=r.images}

    if(images[0])previewUrl=URL.createObjectURL(images[0]);
  }catch(e){err=isPdf?"Couldn't open this PDF here. It's still saved; enter the values below, or upload a screenshot of the report with the Photo button.":"Couldn't open this file. Try a clear photo (JPG/PNG) or a PDF."}
  const sample=await getSample();
  const useText=text.replace(/\s+/g," ").trim().length>150;
  const canImg=sample&&Cap.limits&&Cap.limits.images&&images.length;
  if(sample&&(useText||canImg)){
    try{extracted=await extract(sample,useText?{text}:{images:images.slice(0,Math.min(images.length,Cap.limits.images.maxCount||3))})}
    catch(e){err=e&&(e.code==="no_key"||e.code==="api_error")?e.message+" You can enter the values below.":e&&e.code==="not_granted"?"Automatic reading is off because AI access wasn't allowed. Enter the values below.":"Couldn't read the report automatically. Enter or correct the values below."}

  reviewSheet({extracted,previewUrl,asset,err,fileName:file.name});
}
async function shrinkImage(file){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const max=1800;const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
}
let pdfReady=null;

async function looksPdf(file){

  try{const b=new Uint8Array(await file.slice(0,5).arrayBuffer());return String.fromCharCode(...b)==="%PDF-"}catch(e){return false}
}

  for(let i=1;i<=Math.min(pdf.numPages,6);i++){const pg=await pdf.getPage(i);
    try{const tc=await pg.getTextContent();let lastY=null;let line="";for(const it of tc.items){const y=it.transform?Math.round(it.transform[5]):null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>3){text+=line.trim()+"\n";line=""}line+=it.str+" ";lastY=y}text+=line.trim()+"\n\n"}catch(e){}
    if(i<=3){const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2.2,1500/vp0.width)});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx,viewport:vp}).promise;images.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)))}}
  return {text:text.slice(0,40000),images};
}
async function extract(sample,src){
  const mid=S.sel!=="all"?S.sel:null;
  const known=mid?trendData(mid).params.map(p=>p.name):[];
  const prompt=`You read Indian medical documents: lab reports, prescriptions, discharge summaries. Read the ${src.text?"document text below (extracted from a PDF; table columns may be run together on one line)":"attached page images"} and return JSON only, in exactly this shape:
{"type":"blood"|"prescription"|"other","title":string,"date":"YYYY-MM-DD"|null,"lab":string|null,"patientName":string|null,"results":[{"name":string,"value":number|null,"text":string|null,"unit":string,"low":number|null,"high":number|null}],"medicines":[{"name":string,"dose":string,"frequency":string}],"notes":string}
Rules:
- "blood" means any lab test report with values (blood, urine, thyroid, lipid etc). "prescription" means a doctor's prescription.
- title: short, e.g. "Lipid profile", "CBC & thyroid", or "Dr. Sharma, cardiology follow-up".
- date: the sample collection or report date; prescription date for prescriptions.
- results: one entry per test with a value. Use the number only in value; put non-numeric results (e.g. "Negative") in text with value null. low/high from the printed reference range (for "<100" use low null, high 100).
- Use common short test names (HbA1c, Haemoglobin, Fasting Blood Sugar, TSH, LDL Cholesterol, Vitamin D, Creatinine...).${known.length?" Reuse these exact names where the same test appears: "+known.join(", ")+".":""}
- medicines: brand name with generic in brackets when you know it, e.g. "Glycomet (Metformin)". frequency in plain words, e.g. "Twice daily after meals". Translate 1-0-1, BD, OD, HS, SOS into words.
- notes: advice or follow-up instructions written on the document, in one or two sentences, else "".
- If something isn't readable, leave it out rather than guessing.${src.text?"\n\nDOCUMENT TEXT:\n"+src.text:""}`;
  const r=await sample.json(prompt,src.text?{modelTier:"default"}:{images:src.images,modelTier:"default"});
  if(!r||typeof r!=="object")throw {code:"bad"};
  return r;
}

async function ask(q){
  q=q.trim();if(!q||S.chatBusy)return;
  const ai=$("#askIn");if(ai&&coarse)ai.blur();document.body.classList.remove("typing");
  S.chat.push({role:"user",content:q});const ans={role:"assistant",content:""};S.chat.push(ans);S.chatBusy=true;render();scrollEnd();
  const sample=await getSample();
  if(!sample){ans.content="The assistant isn't available in this view. Open this app from your Claude account and allow AI access to ask questions.";S.chatBusy=false;render();return}
  const hist=S.chat.slice(0,-2).slice(-8).map(c=>`${c.role==="user"?"Q":"A"}: ${c.content}`).join("\n");
  const today=new Date().toISOString().slice(0,10);
  const prompt=`You are a friendly family health assistant inside a personal health records app in India. Today is ${today}. Answer ONLY from the records below. If the records don't contain the answer, say so plainly. Mention report dates when you cite values. Explain medical terms in simple words. H/L marks values above/below the lab's reference range. Do not diagnose or change treatment; when something looks concerning, suggest discussing it with their doctor. Reply in the language the question is asked in (Hindi, Hinglish or English). Keep answers short: a few sentences or a short "- " list. No headings, no tables.

RECORDS:
${contextText()}
${hist?"\nEARLIER IN THIS CHAT:\n"+hist+"\n":""}
QUESTION: ${q}`;
  try{await sample(prompt,{cache:false,modelTier:"default",onText:({text})=>{ans.content=text;updateLastMsg(text)}})}
  catch(e){ans.content=e&&(e.code==="no_key"||e.code==="api_error")?e.message:e&&e.text?e.text:(e&&e.code==="not_granted"?"AI access wasn't allowed for this page, so I can't answer. You can allow it from the page's permissions.":"Something went wrong getting an answer. Try again in a moment.")}

    S.tab="records";handleFile(f);
  }catch(e){toast("Couldn't open the shared file")}
};
const _put=put;put=async function(doc){await _put(doc);if(sharedWaiting&&doc.kind==="member"){const f=sharedWaiting;sharedWaiting=null;setTimeout(()=>handleFile(f),300)}};
loadLocal();render();initCloud();
})();
</script>
